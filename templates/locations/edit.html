{% extends "base.html" %}

{% block title %}Edit Location - Sip & Snack Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Edit Location</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{{ url_for('locations.index') }}" class="btn btn-secondary">
<i class="ri-arrow-right-s-line icon me-2"></i>
            Back to Locations
        </a>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Location Name *</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ location.name }}" required>
                        <div class="form-text">e.g., Downtown Branch, Mall Location</div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3">{{ location.address or '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" name="city" value="{{ location.city or '' }}">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="state" class="form-label">State</label>
                            <input type="text" class="form-control" id="state" name="state" value="{{ location.state or '' }}">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="zip_code" class="form-label">ZIP Code</label>
                            <input type="text" class="form-control" id="zip_code" name="zip_code" value="{{ location.zip_code or '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ location.phone or '' }}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ location.email or '' }}">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
<i class="ri-checkbox-circle-line icon me-2"></i>
                            Update Location
                        </button>
                        <a href="{{ url_for('locations.index') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h6 class="card-title mb-0">Location Information</h6>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-6">Created:</dt>
                    <dd class="col-sm-6">{{ location.created_at.strftime('%Y-%m-%d') }}</dd>
                </dl>

                <div class="mt-3">
                    <a href="{{ url_for('location_menu.manage', location_id=location.id) }}" class="btn btn-success w-100">
<i class="ri-shopping-cart-2-line icon me-2"></i>
                        Manage Menu
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
