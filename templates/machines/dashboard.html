{% extends "base.html" %}

{% block title %}Machines - Sip & Snack Portal{% endblock %}

{% block extra_head %}
<style>
    .machine-card { border: none; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); transition: box-shadow .2s ease; }
    .machine-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.14); }
    .machine-icon-circle {
        width: 64px; height: 64px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; color: #fff;
        background: radial-gradient(circle at 30% 30%, #157a5e, #0f5f49);
        box-shadow: inset 0 -4px 8px rgba(0,0,0,.15), 0 4px 10px rgba(21,122,94,.35);
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap align-items-center gap-2 pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="ri-cpu-line icon me-2"></i>Machines</h1>
</div>

<div class="row">
    <div class="col-sm-6 col-lg-4 mb-3">
        <div class="card machine-card h-100">
            <div class="card-body text-center py-4">
                <div class="machine-icon-circle mx-auto"><i class="ri-drop-line"></i></div>
                <h5 class="card-title mb-1">Electric Idli Machine</h5>
                <p class="text-muted small mb-3">Live temperature, heater, sensor &amp; cooking-session monitoring</p>
                <a href="{{ url_for('machines.idli_detail') }}" class="btn btn-success w-100">
                    <i class="ri-cpu-line icon me-1"></i>View Machine
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
