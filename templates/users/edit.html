{% extends 'base.html' %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="container-fluid mt-3">
    <h2 class="mb-3">Edit User</h2>
    <div class="card">
        <div class="card-body">
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" value="{{ user.email }}" disabled>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Full Name</label>
                        <input class="form-control" type="text" name="full_name" value="{{ user.full_name }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Picture URL</label>
                        <input class="form-control" type="url" name="picture_url" value="{{ user.picture_url }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Position</label>
                        <select class="form-select" name="position_id">
                            <option value="">- None -</option>
                            {% for p in positions %}
                            <option value="{{ p.id }}" {% if user.position_id == p.id %}selected{% endif %}>{{ p.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" name="department_id">
                            <option value="">- None -</option>
                            {% for d in departments %}
                            <option value="{{ d.id }}" {% if user.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Access Role</label>
                        <select class="form-select" name="role">
                            {% set _role = user.role or 'worker' %}
                            <option value="worker" {% if _role == 'worker' %}selected{% endif %}>Worker (store manager) — runs one store</option>
                            <option value="manager" {% if _role == 'manager' %}selected{% endif %}>Manager — all stores except user admin</option>
                            <option value="admin" {% if _role == 'admin' %}selected{% endif %}>Admin — full access</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Assigned Store</label>
                        <select class="form-select" name="location_id">
                            <option value="">- All / None -</option>
                            {% for l in locations %}
                            <option value="{{ l.id }}" {% if user.location_id == l.id %}selected{% endif %}>{{ l.name }}{% if l.city %} ({{ l.city }}){% endif %}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">A Worker tied to a store only sees that store's data.</div>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if user.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">Active</label>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <a href="{{ url_for('users.view', user_id=user.id) }}" class="btn btn-secondary">Cancel</a>
                    <button class="btn btn-primary" type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
