<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>No store assigned · Sip &amp; Snack</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link href="{{ url_for('static', filename='css/roboto.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/remixicon/remixicon.css') }}" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;min-height:100dvh;background:#f5f6f8;color:#1f2937;
      font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
      padding:2rem 1.5rem;padding-top:calc(2rem + env(safe-area-inset-top));}
    .logo{width:110px;height:110px;object-fit:contain;margin-bottom:1.25rem;}
    .card{background:#fff;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.08);max-width:420px;width:100%;padding:1.75rem 1.5rem;}
    h1{font-size:1.3rem;font-weight:600;margin:0 0 .6rem;}
    p{color:#6b7280;line-height:1.55;margin:0 0 1.25rem;}
    .icon-circle{width:64px;height:64px;border-radius:50%;background:#fff3cd;color:#b8860b;
      display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 1rem;}
    a.btn{display:inline-block;background:#0d6efd;color:#fff;text-decoration:none;font-weight:600;
      padding:.75rem 1.5rem;border-radius:10px;min-height:46px;}
    .signout{margin-top:1rem;}
    .signout a{color:#6b7280;text-decoration:none;font-size:.9rem;}
  </style>
</head>
<body>
  <img class="logo" src="{{ url_for('static', filename='img/sn15-logo-transparent.png') }}" alt="Sip & Snack">
  <div class="card">
    <div class="icon-circle"><i class="ri-store-2-line"></i></div>
    <h1>No store assigned yet</h1>
    <p>Your account isn't linked to a store. Please ask your <b>admin</b> to assign you to a store, then sign in again.</p>
    <a class="btn" href="{{ url_for('auth.logout') }}">Sign out</a>
  </div>
  <div class="signout"></div>
</body>
</html>
