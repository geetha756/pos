<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Sip &amp; Snack</title>
  <link href="/static/css/roboto.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f6f8;
      color: #1f2937;
    }
    img { width: 88px; height: 88px; margin-bottom: 1.25rem; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; color: #6b7280; max-width: 22rem; line-height: 1.5; }
    button {
      border: none;
      background: #0d6efd;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      padding: .8rem 1.6rem;
      border-radius: 10px;
      min-height: 48px;
    }
    button:active { background: #0b5ed7; }
  </style>
</head>
<body>
  <img src="/static/icons/icon-192.png" alt="Sip & Snack">
  <h1>You're offline</h1>
  <p>The portal needs an internet connection to load live sales, orders and inventory. Reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
